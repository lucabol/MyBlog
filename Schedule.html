<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      line-height: 1.4;
      color: #222;
    }

    h1 {
      margin-bottom: 1rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 760px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 0.75rem 1rem;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f0f4f7;
    }

    tbody tr:nth-child(even) {
      background: #fafafa;
    }

    .name-col {
      font-weight: 600;
    }

    time {
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      body {
        margin: 1rem;
      }

      th,
      td {
        padding: 0.6rem;
      }

      time {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Schedule</h1>

    <table aria-label="Schedule">
      <thead>
        <tr>
          <th>Name</th>
          <th>Arriving</th>
          <th>Leaving</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="name-col">Luca &amp; Dante</td>
          <td><time>Sun 6 Sept, 21:20</time></td>
          <td><time>Sun 13 Sept, 19:05</time></td>
        </tr>
        <tr>
          <td class="name-col">Luca &amp; Maia (out 28th)</td>
          <td><time>Fri 25 Sept, 19:00</time></td>
          <td><time>Tue 13 Oct, 14:10</time></td>
        </tr>
        <tr>
          <td class="name-col">Fra</td>
          <td><time>Tue 13 Oct, 16:25</time></td>
          <td><time>Thu 29 Oct, 15:55</time></td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
