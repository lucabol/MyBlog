{% extends "base.html" %}

{% block content %}
<div class="about">
    <h1>{{ site.author }}</h1>

    <p>
        Luca is a hacker, a manager, a volleyball player, an aspiring tennis player,
        an okay father and husband. He works for Microsoft and lives in Italy.
    </p>
    <p>
        You can contact him by <a href="mailto:luca@lucabol.com">email</a>.
    </p>

    <nav class="social-links" aria-label="{{ site.author }} elsewhere">
        <a href="https://github.com/lucabol" class="social-link" rel="me" aria-label="{{ site.author }} on GitHub">
            <img src="/img/github.svg" alt="GitHub profile" width="32" height="32" decoding="async">
        </a>
        <a href="https://www.linkedin.com/in/lucabol/" class="social-link" rel="me" aria-label="{{ site.author }} on LinkedIn">
            <img src="/img/linkedin.svg" alt="LinkedIn profile" width="32" height="32" decoding="async">
        </a>
        <a href="/feed.xml" class="social-link" aria-label="Subscribe to the RSS feed">
            <img src="/img/rss.svg" alt="RSS feed" width="32" height="32" decoding="async">
        </a>
    </nav>
</div>
{% endblock %}
