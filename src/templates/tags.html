{% extends "base.html" %}

{% block content %}
    <h1>Tags</h1>

    <ul class="tags-list">
    {% for tag in tag_items %}
        <li>
            <a href="{{ tag.url }}" aria-label="Browse {{ tag.count }} {{ 'note' if tag.count == 1 else 'notes' }} tagged {{ tag.name }}">{{ tag.name }}</a>
            <span class="tag-count">({{ tag.count }})</span>
        </li>
    {% endfor %}
    </ul>
{% endblock %}
